name: CI

# Smoke test di import + suite test (ISSUE "Miglioramenti" #1).
# Un job `node -e "import('./api/_lib/svg-builder.js')"` avrebbe dato feedback
# immediato su rotture di modulo; ora è coperto da tests/import-smoke.test.js
# eseguito in CI a ogni push/PR.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Smoke test di import: feedback immediato su rotture di modulo.
      # Fallisce il CI al primo import non risolvibile, prima dei test funzionali.
      - name: Import smoke test
        run: node -e "import('./api/_lib/svg-builder.js').then(() => console.log('import smoke OK')).catch((e) => { console.error(e); process.exit(1); })"

      - name: Run tests
        run: npm test

      # Lint gate (ISSUE-26): ESLint fallisce su errori, bloccando il merge
      # quando compaiono undefined globals, regole sconosciute o import rotti.
      # I warning restano visibili ma non bloccano la CI.
      - name: Lint
        run: npm run lint

      # Format gate (ISSUE-N5): Prettier fallisce su qualsiasi file non
      # formattato (single quotes, semicolons, 80ch, no tabs), impedendo il
      # drift di stile che era passato inosservato senza questo check.
      - name: Format check
        run: npm run format:check
